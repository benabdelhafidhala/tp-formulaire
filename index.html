<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>
                Informations personelles
            </legend>
            <div class="row">
                <div>
                    <label for="nom">Nom *</label>
                    <input type="text" id="nom" name="nom" placeholder="Ex : Dupont" autocomplete="family-name" autofocus tabindex="1">
                </div>
                <div>
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom">
                </div>
            </div>
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" placeholder="Ex : marie@gmail.com" autocomplete="email" tabindex="2">
            <label for="tel">Téléphone *</label>
            <input type="tel" id="tel" name="tel" placeholder="Ex : 06 12 34 56 78" pattern="^(0|\+33)[1-9]([-. ]?[0-9]{2}){4}$">
            <label for="mdp">Mot de passe *</label>
            <input type="password" id="mdp" name="mdp" required minlength="8" maxlength="30">
        </fieldset>
        <fieldset>
            <legend>
                Votre profil sportif
            </legend>
            <label for="sport">Sport pratiqué *</label>
            <select name="sport" id="sport">
                <optgroup label="Sports collectifs">
                    <option value="football">Football</option>
                    <option value="basketball">Basketball</option>
                </optgroup>
                <optgroup label="Sports indivuels">
                    <option value="natation">Natation</option>
                    <option value="yoga">yoga</option>
                </optgroup>
            </select>

            <label for="ville">votre ville</label>
            <input type="text" id="ville" name="ville" list="villes" value="Paris">
            <datalist id="villes">
                <option value="Paris"></option>
                <option value="Lyon"></option>
                <option value="Marseille"></option>
            </datalist>
            <label>Niveau *</label>
            <input type="radio" name="niveau" value="debutant" id="n1" checked>
            <label for="n1">Débutant</label>
            <input type="radio" name="niveau" value="confirme" id="n2">
            <label for="n2">Intermidiaire</label>
            <input type="radio" name="niveau" value="cofirme" id="n3">
            <label for="n3">confirmé</label>

            <label> créneaux souhaités</label>
            <input type="checkbox" name="creneau" value="Matin" id="c1">
            <label for="c1">Matin</label>
            <input type="checkbox" name="creneau" value="Aprés-midi" id="c2">
            <label for="c2">Aprés-midi</label>
            <input type="checkbox" name="creneau" value="Soir" id="c3">
            <label for="c3">Soir</label>
            <input type="checkbox" name="creneau" value="Week-end" id="c3">
            <label for="c3">Week-end</label>
            <label for="naissance"> Date de naissance</label>
            <input type="date" id="naissance" name="naissance">

            <label for="bio">Présentez-vous (200 caractére max)</label>
            <textarea name="bio" id="bio" rows="4" maxlength="200" placeholder="Parlez-nous de vous...."></textarea>

            <label for="experience">Années d'experience</label>
            <input type="number" id="experience" name="experience" min="0" max="50">
        </fieldset>
        <fieldset>
            <legend>
                Validation
            </legend>
            <p class="erreur" id="erreur-mdp" style="display: none; color:#d64545">
                Les deux mots de passe ne correspondent pas.
            </p>
        </fieldset>
    </form>
</body>
</html>
